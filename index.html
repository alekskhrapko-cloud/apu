<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Авто ПУ">
<meta name="theme-color" content="#0b3a75">
<title>Авто ПУ</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<style>
:root{
  --bg:#f3f4f6;--card:#fff;--ink:#111827;--muted:#6b7280;--line:#e5e7eb;--soft:#f9fafb;
  --acc:#0b57b7;--acc-ink:#fff;--acc-soft:#e8f0fb;--yel:#ffd500;--red:#c62828;--red-soft:#fdecec;
  --st-pr:#6b7280;--st-ok:#0b57b7;--st-go:#d97706;--st-at:#7c3aed;--st-pax:#0e7490;--st-done:#15803d;--st-x:#9ca3af;
  --r:14px;--sh:0 1px 2px rgba(0,0,0,.05),0 1px 8px rgba(0,0,0,.04);
  --safe-b:env(safe-area-inset-bottom,0px);--safe-t:env(safe-area-inset-top,0px);
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0f1115;--card:#181b21;--ink:#f1f3f6;--muted:#9aa3af;--line:#2a2f37;--soft:#1e222a;
  --acc:#5b9cf0;--acc-ink:#08111f;--acc-soft:#16253b;--red:#ef6b6b;--red-soft:#3a1d1f;
  --st-pr:#9aa3af;--st-ok:#5b9cf0;--st-go:#f0a83a;--st-at:#a78bfa;--st-pax:#22d3ee;--st-done:#4ade80;--st-x:#6b7280;
  --sh:none;
}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--acc)}
.hidden{display:none!important}
.num{font-variant-numeric:tabular-nums}

/* top bar */
.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:saturate(1.6) blur(12px);-webkit-backdrop-filter:saturate(1.6) blur(12px);padding:calc(var(--safe-t) + 10px) 16px 10px;border-bottom:1px solid var(--line)}
.top-row{display:flex;align-items:center;gap:10px}
.top h1{font-size:20px;margin:0;font-weight:700;letter-spacing:-.01em;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .sub{color:var(--muted);font-size:13px;margin-top:2px}
.ib{border:0;background:var(--card);box-shadow:var(--sh);border-radius:12px;height:40px;min-width:40px;padding:0 12px;display:inline-flex;align-items:center;justify-content:center;gap:6px;cursor:pointer;font-size:14px;font-weight:600}
.ib svg{width:18px;height:18px}
.spin svg{animation:sp 1s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}

main{padding:12px 12px calc(110px + var(--safe-b));max-width:760px;margin:0 auto}
.wide main{max-width:1200px}
.banner{margin:10px 12px 0;padding:10px 12px;border-radius:12px;font-size:14px;background:var(--acc-soft)}
.banner.err{background:var(--red-soft);color:var(--red)}

/* login */
.login{min-height:100dvh;display:flex;flex-direction:column;justify-content:center;padding:24px;max-width:420px;margin:0 auto}
.logo{width:72px;height:72px;border-radius:18px;background:var(--acc);display:flex;align-items:center;justify-content:center;margin-bottom:18px}
.logo svg{width:44px;height:44px}
.login h2{font-size:28px;margin:0 0 4px;letter-spacing:-.02em}
.login p{color:var(--muted);margin:0 0 24px}
.fld{display:block;margin-bottom:14px}
.fld span{display:block;font-size:13px;color:var(--muted);margin-bottom:6px;font-weight:600}
.inp{width:100%;height:50px;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:0 14px;font-size:17px;outline:none}
.inp:focus{border-color:var(--acc);box-shadow:0 0 0 3px var(--acc-soft)}
textarea.inp{height:auto;min-height:80px;padding:12px 14px;resize:vertical}
.btn{width:100%;height:52px;border:0;border-radius:14px;background:var(--acc);color:var(--acc-ink);font-weight:700;font-size:17px;cursor:pointer}
.btn:disabled{opacity:.6}
.btn.ghost{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:var(--red-soft);color:var(--red)}
.err{color:var(--red);font-size:14px;min-height:20px;margin:6px 0}
.hint{margin-top:28px;font-size:13px;color:var(--muted);background:var(--card);border-radius:12px;padding:12px 14px;box-shadow:var(--sh)}

/* sections & cards */
.sec{margin:18px 4px 8px;display:flex;align-items:baseline;gap:8px}
.sec h3{margin:0;font-size:17px;letter-spacing:-.01em}
.sec .c{color:var(--muted);font-size:14px}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);padding:14px;margin-bottom:10px;position:relative;border:1px solid transparent}
.card.new{border-color:var(--yel);box-shadow:0 0 0 2px color-mix(in srgb,var(--yel) 45%,transparent)}
.card.conf{border-color:var(--red)}
.card.x{opacity:.55}
.card.x .tm,.card.x .pts{text-decoration:line-through}
.chead{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.tm{font-size:22px;font-weight:750;letter-spacing:-.02em}
.tm small{font-size:15px;font-weight:600;color:var(--muted)}
.chip{font-size:12px;font-weight:700;border-radius:999px;padding:3px 9px;background:var(--soft);color:var(--muted);white-space:nowrap}
.chip.st{color:#fff}
.chip.badge{background:var(--yel);color:#3a2f00}
.chip.cf{background:var(--red);color:#fff}
.chip.car{background:var(--acc-soft);color:var(--acc)}
.sp{flex:1}
.pts{margin:10px 0 4px;display:grid;grid-template-columns:18px 1fr auto;gap:2px 10px;align-items:start}
.dot{width:10px;height:10px;border-radius:50%;margin:6px 4px 0;border:2px solid var(--acc)}
.dot.b{background:var(--acc)}
.vline{width:2px;background:var(--line);margin:0 8px;min-height:10px}
.pt{font-weight:600;word-break:break-word}
.pt small{display:block;color:var(--muted);font-weight:500}
.nav{border:0;background:var(--acc-soft);color:var(--acc);border-radius:10px;height:34px;padding:0 10px;font-size:13px;font-weight:700;display:inline-flex;align-items:center;gap:4px;text-decoration:none;white-space:nowrap}
.meta{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;margin-top:10px;font-size:14px}
.meta dt{color:var(--muted)}
.meta dd{margin:0;word-break:break-word;white-space:pre-line}
.acts{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.act{flex:1;min-width:120px;height:46px;border:0;border-radius:12px;font-weight:700;font-size:15px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none}
.act.main{background:var(--acc);color:var(--acc-ink)}
.act.sec2{background:var(--soft);color:var(--ink);flex:0 0 auto;min-width:46px;padding:0 14px}
.empty{text-align:center;color:var(--muted);padding:48px 16px}
.empty b{display:block;color:var(--ink);font-size:17px;margin-bottom:4px}
.calls{display:flex;gap:8px;overflow-x:auto;padding:2px 4px 4px;margin:0 -4px;scrollbar-width:none}
.calls a{flex:0 0 auto;text-decoration:none;color:var(--ink);background:var(--card);box-shadow:var(--sh);border-radius:12px;padding:8px 12px;font-size:14px;display:flex;align-items:center;gap:8px}
.calls a svg{width:16px;height:16px;color:var(--st-done)}

/* coordinator */
.dbar{display:flex;align-items:center;gap:8px;margin-top:10px}
.dbar .d{flex:1;text-align:center;font-weight:700}
.dbar input[type=date]{position:absolute;opacity:0;pointer-events:none;width:0;height:0}
.seg{display:flex;background:var(--soft);border-radius:12px;padding:3px;margin-top:10px}
.seg button{flex:1;border:0;background:transparent;height:34px;border-radius:9px;font-weight:600;font-size:14px;color:var(--muted);cursor:pointer}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:var(--sh)}
.stats{display:flex;gap:8px;overflow-x:auto;margin:12px 0 4px;scrollbar-width:none}
.stat{flex:0 0 auto;background:var(--card);box-shadow:var(--sh);border-radius:12px;padding:8px 12px;font-size:13px;color:var(--muted);border:0;text-align:left;cursor:pointer}
.stat b{display:block;font-size:20px;color:var(--ink)}
.stat.warn b{color:var(--red)}
.stat.on{outline:2px solid var(--acc)}
.search{margin-top:10px}

.tl{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);overflow:hidden;margin-top:10px}
.tl-scroll{overflow-x:auto;position:relative}
.tl-grid{position:relative}
.tl-hours{display:flex;height:28px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--card);z-index:2}
.tl-hours div{flex:0 0 auto;font-size:11px;color:var(--muted);padding:6px 0 0 4px;border-left:1px solid var(--line)}
.tl-row{display:flex;border-bottom:1px solid var(--line);min-height:58px}
.tl-lab{position:sticky;left:0;z-index:3;flex:0 0 96px;background:var(--card);border-right:1px solid var(--line);padding:8px;font-size:12px;line-height:1.25}
.tl-lab b{display:block;font-size:13px}
.tl-lab span{color:var(--muted)}
.tl-lane{position:relative;flex:0 0 auto}
.tl-blk{position:absolute;border-radius:8px;padding:4px 6px;font-size:11px;line-height:1.2;overflow:hidden;color:#fff;cursor:pointer;border:0;text-align:left}
.tl-blk b{display:block;font-size:12px}
.tl-blk.cf{outline:2px solid var(--red);outline-offset:1px}
.tl-blk.x{opacity:.45;text-decoration:line-through}
.tl-now{position:absolute;top:0;bottom:0;width:2px;background:var(--red);z-index:1;pointer-events:none}

.fab{position:fixed;right:16px;bottom:calc(18px + var(--safe-b));z-index:30;height:56px;border-radius:18px;border:0;background:var(--acc);color:var(--acc-ink);font-weight:700;font-size:16px;padding:0 20px;box-shadow:0 8px 24px rgba(11,87,183,.35);display:flex;align-items:center;gap:8px;cursor:pointer}
.carl .card{display:flex;gap:12px;align-items:center}
.carl .ci{flex:1;min-width:0}
.carl .ci b{display:block}
.carl .ci span{color:var(--muted);font-size:14px}

/* sheet */
.ov{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.4);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:640px;max-height:94dvh;border-radius:20px 20px 0 0;display:flex;flex-direction:column;animation:up .2s ease}
@keyframes up{from{transform:translateY(30px);opacity:.6}}
.sh-h{display:flex;align-items:center;gap:8px;padding:14px 16px;border-bottom:1px solid var(--line)}
.sh-h h3{margin:0;flex:1;font-size:18px}
.sh-b{overflow-y:auto;padding:14px 16px}
.sh-f{padding:12px 16px calc(12px + var(--safe-b));border-top:1px solid var(--line);display:flex;gap:8px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
.hero{background:var(--card);border-radius:18px;box-shadow:var(--sh);padding:16px;margin:4px 0 12px;border:2px solid var(--acc)}
.hero.late{border-color:var(--red)}
.hero-top{display:flex;justify-content:space-between;align-items:center;font-weight:700;color:var(--acc);font-size:14px;text-transform:uppercase;letter-spacing:.04em}
.hero-tm{font-size:34px;font-weight:800;letter-spacing:-.03em;margin-top:4px}
.hero-tm small{font-size:18px;color:var(--muted);font-weight:600}
.hero-timing{font-weight:600;color:var(--muted)}
.hero.late .hero-timing{color:var(--red)}
.hero-note{font-size:14px;margin-top:6px}
.hero-btn{margin-top:14px;height:58px;font-size:18px}
.hero-hint{font-size:12px;color:var(--muted);text-align:center;margin-top:6px}
.stepper{display:grid;gap:0;margin-top:12px}
.stp{display:grid;grid-template-columns:18px 1fr;column-gap:10px;padding:4px 0;position:relative}
.stp i{grid-row:span 2;width:14px;height:14px;border-radius:50%;border:2px solid var(--line);margin-top:3px;background:var(--card)}
.stp b{font-size:12px;color:var(--muted);font-weight:600}
.stp span{font-weight:600;word-break:break-word}
.stp.done i{background:var(--st-done);border-color:var(--st-done)}
.stp.done span{color:var(--muted)}
.stp.cur i{border-color:var(--acc);box-shadow:0 0 0 4px var(--acc-soft)}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin:4px 0 6px}
.tool{border:0;background:var(--card);box-shadow:var(--sh);border-radius:12px;height:38px;padding:0 12px;font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:6px;color:var(--ink);text-decoration:none;cursor:pointer}
.quick{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.chipbtn{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px;font-size:13px;cursor:pointer}
.chk{display:inline-flex;align-items:center;gap:6px;font-size:14px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:6px 12px}
.carimg{width:64px;height:64px;border-radius:12px;object-fit:cover;flex:0 0 auto}
.toast{position:fixed;left:50%;bottom:calc(90px + var(--safe-b));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;z-index:60;max-width:90vw}
@media (min-width:900px){.ov{align-items:center}.sheet{border-radius:20px}}
</style>
</head>

<div id="app"></div>
<script>

// ====== КОНФІГ ======

const ST_COL = { 'призначено': 'var(--st-pr)', 'прийнято': 'var(--st-ok)', 'в дорозі': 'var(--st-go)', 'на місці': 'var(--st-at)', 'з пасажирами': 'var(--st-pax)', 'завершено': 'var(--st-done)', 'відмінено': 'var(--st-x)' };
const ACTIVE = ['в дорозі', 'на місці', 'з пасажирами'];
// Наступний крок для водія: куди перевести статус, підпис кнопки, куди вести навігацію.
function nextStep(t) {
  switch (t.status) {
    case 'призначено': return { to: 'прийнято', label: 'Прийняв завдання' };

}
const ls = {
  get(k, d) { try { const v = localStorage.getItem('apu.' + k); return v == null ? d : JSON.parse(v); } catch { return d; } },

};
function dObj(iso) { return new Date(iso + 'T12:00:00'); }

function iso8(d) { return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
function dayTitle(iso, today) {
  const d = dObj(iso), base = d.getDate() + ' ' + MON[d.getMonth()];
  if (iso === today) return 'Сьогодні, ' + base;

  if (iso === addDays(today, -1)) return 'Вчора, ' + base;

}
function mins(t) {
  const m = /(\d{1,2})[:.](\d{2})/.exec(String(t || ''));

  const s = all.length ? mins(all[0]) : mins(t.tTo);
  let e = all.length > 1 ? mins(all[1]) : mins(t.tTo);

  if (e == null || e <= s) e = s + 60;
  return [s, e];

function fmtT(t) { const m = mins(t); return m == null ? (t || '—') : hhmm(m); }
function tel(p) { return 'tel:' + String(p).replace(/[^\d+]/g, ''); }
function fmtPhone(p) { return String(p || '').replace(/^\+?(\d{2,3})(\d{2,3})(\d{3})(\d{2})(\d{2,})$/, '+$1 $2 $3 $4 $5'); }
const URL_RE = /https?:\/\/\S+/;
// Точка з таблиці → {url} (готове посилання на карту) або {q} (адреса для пошуку).
function resolvePoint(point) {
  const p = String(point || '').trim();
  if (!p) return null;
  const u = URL_RE.exec(p); if (u) return { url: u[0], q: p.replace(URL_RE, '').trim() };
  const low = p.toLowerCase();
  const a = (S.data?.addresses || []).find(x => low === x.name.toLowerCase() || low.startsWith(x.name.toLowerCase()));
  if (a) return URL_RE.test(a.nav) ? { url: URL_RE.exec(a.nav)[0], q: p } : { q: a.nav };
  return { q: /berlin|schönefeld|ber\b|\d{5}/i.test(p) ? p : p + ', Berlin' };
}
function mapsApp() { return ls.get('maps', 'google'); }
// Навігація від поточної позиції до точки.
function navHref(point) {
  const r = resolvePoint(point); if (!r) return null;
  if (r.url) return r.url;
  if (mapsApp() === 'apple') return 'https://maps.apple.com/?daddr=' + encodeURIComponent(r.q) + '&dirflg=d';
  return 'https://www.google.com/maps/dir/?api=1&destination=' + encodeURIComponent(r.q) + '&travelmode=driving&dir_action=navigate';
}
// Посилання «показати точку на карті» (для повідомлень колегам).
function placeHref(point) {
  const r = resolvePoint(point); if (!r) return null;
  return r.url || 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(r.q);
}
// Маршрут через кілька зупинок (лише Google Maps підтримує проміжні точки в посиланні).
function routeHref(points) {
  const qs = [];
  points.forEach(p => { const r = resolvePoint(p); if (!r) return; const q = r.url ? (r.q || p) : r.q; if (q && qs[qs.length - 1] !== q) qs.push(q); });
  if (!qs.length) return null;
  const dest = qs.pop(), wp = qs.slice(-8);
  return 'https://www.google.com/maps/dir/?api=1&destination=' + encodeURIComponent(dest) + (wp.length ? '&waypoints=' + encodeURIComponent(wp.join('|')) : '') + '&travelmode=driving';
}
function flightHref(f) { const m = /\b([A-Z0-9]{2}|[A-Z]{3})\s?(\d{1,4})\b/i.exec(String(f || '')); return m ? 'https://www.flightradar24.com/data/flights/' + (m[1] + m[2]).toLowerCase() : null; }
function cleanPt(p) { return String(p || '').replace(URL_RE, '').replace(/\s+/g, ' ').replace(/[,\s]+$/, '').trim(); }
function nowMin() { const n = new Date(); return n.getHours() * 60 + n.getMinutes(); }
function dur(m) { m = Math.abs(m); return m >= 60 ? Math.floor(m / 60) + ' год ' + (m % 60 ? (m % 60) + ' хв' : '') : m + ' хв'; }
function tripHash(t) { return [t.date, t.tFrom, t.from, t.tTo, t.to, t.people, t.pax, t.car, t.flight, t.route, t.contact, t.type, t.status === 'відмінено' ? 'x' : ''].join('|'); }
function toast(msg) {
  const el = h('div', { class: 'toast' }, msg);
  document.body.append(el); setTimeout(() => el.remove(), 2600);
}

// ====== API ======
async function api(action, payload = {}) {
  const res = await fetch(API, { method: 'POST', body: JSON.stringify({ action, token: S.token, ...payload }) });
  if (!res.ok) throw new Error('Сервер недоступний (' + res.status + ')');
  const j = await res.json();
  if (!j.ok && j.error === 'auth') { logout(j.message); throw new Error(j.message); }
  if (!j.ok) throw new Error(j.error || 'Помилка');
  return j;
}

// ====== стан ======
const S = {
  token: ls.get('token', null), user: ls.get('user', null), data: ls.get('data', null), loadedAt: ls.get('loadedAt', null),
  loading: false, error: '', offline: false,
  view: ls.get('view', 'timeline'), day: null, filter: '', q: '', seen: ls.get('seen', null)
};

function logout(msg) {
  ['token', 'user', 'data', 'loadedAt', 'seen'].forEach(ls.del);
  Object.assign(S, { token: null, user: null, data: null, seen: null });
  renderLogin(msg || '');
}

async function load(range) {
  if (S.loading) return;
  S.loading = true; paintBusy();
  try {
    const d = await api('data', range || (S.user?.admin && S.data ? { from: S.data.from, to: S.data.to } : {}));
    S.data = d; S.user = d.user; S.loadedAt = Date.now(); S.error = ''; S.offline = false;
    if (!S.day || (S.day < d.from || S.day > d.to)) S.day = d.today;
    if (!S.seen) { S.seen = {}; d.trips.forEach(t => S.seen[t.uid] = tripHash(t)); ls.set('seen', S.seen); }
    ls.set('data', d); ls.set('user', d.user); ls.set('loadedAt', S.loadedAt);
  } catch (e) {
    S.error = e.message; S.offline = !navigator.onLine || /fetch|network|Load failed/i.test(e.message);
  } finally {
    S.loading = false;
    if (S.token) render();
  }
}
function paintBusy() { const b = $('#refresh'); if (b) b.classList.toggle('spin', S.loading); }
function markSeen(t) { S.seen = S.seen || {}; S.seen[t.uid] = tripHash(t); ls.set('seen', S.seen); }
function badgeOf(t) {
  if (!S.seen) return null;
  if (!(t.uid in S.seen)) return 'НОВЕ';
  if (S.seen[t.uid] !== tripHash(t)) return 'ЗМІНЕНО';
  return null;
}

// ====== ВХІД ======

  const app = $('#app'); app.replaceChildren();
  const err = h('div', { class: 'err' }, msg || '');
  const login = h('input', { class: 'inp', autocomplete: 'username', autocapitalize: 'none', autocorrect: 'off', spellcheck: 'false', placeholder: 'наприклад, Meleshko', value: ls.get('lastLogin', '') });
  const pin = h('input', { class: 'inp num', type: 'password', inputmode: 'numeric', pattern: '[0-9]*', autocomplete: 'current-password', maxlength: '8', placeholder: '••••••' });
  const btn = h('button', { class: 'btn', type: 'submit' }, 'Увійти');
  const form = h('form', {
    onsubmit: async e => {
      e.preventDefault(); err.textContent = ''; btn.disabled = true; btn.textContent = 'Перевіряю…';
      try {
        const j = await api('login', { login: login.value.trim(), pin: pin.value.trim() });
        S.token = j.token; S.user = j.user; ls.set('token', j.token); ls.set('user', j.user); ls.set('lastLogin', login.value.trim());
        S.data = null; S.seen = null; ls.del('seen');

      } catch (x) { err.textContent = x.message; btn.disabled = false; btn.textContent = 'Увійти'; pin.value = ''; pin.focus(); }
    }
  },
    h('label', { class: 'fld' }, h('span', null, 'Логін'), login),
    h('label', { class: 'fld' }, h('span', null, 'PIN-код'), pin),
    err, btn);
  const ios = /iphone|ipad|ipod/i.test(navigator.userAgent), standalone = navigator.standalone || matchMedia('(display-mode: standalone)').matches;
  app.append(h('div', { class: 'login' },
    h('div', { class: 'logo', html: I.car.replace('currentColor', '#fff') }),
    h('h2', null, 'Авто ПУ'),
    h('p', null, 'Поїздки та завдання для водіїв'),
    form,
    !standalone ? h('div', { class: 'hint' }, ios
      ? 'Щоб застосунок був на екрані: у Safari натисніть «Поділитися» ⬆︎ → «На початковий екран».'
      : 'Щоб застосунок був на екрані: меню браузера → «Додати на головний екран».') : null));
  setTimeout(() => (login.value ? pin : login).focus(), 50);
}

// ====== ГОЛОВНИЙ РЕНДЕР ======
function render() {
  if (!S.token) return renderLogin();
  const coord = !!S.user?.admin;
  document.body.classList.toggle('wide', coord);
  const app = $('#app'); app.replaceChildren();
  const updated = S.loadedAt ? 'оновлено о ' + new Date(S.loadedAt).toLocaleTimeString('uk-UA', { hour: '2-digit', minute: '2-digit' }) : 'завантаження…';
  const top = h('header', { class: 'top' },
    h('div', { class: 'top-row' },
      h('div', { style: 'flex:1;min-width:0' },
        h('h1', null, coord ? 'Координація авто' : (S.user?.name || 'Мої поїздки')),
        h('div', { class: 'sub' }, coord ? (S.user?.name + ' · ' + updated) : (carsLine() + ' · ' + updated))),
      h('button', { class: 'ib' + (S.loading ? ' spin' : ''), id: 'refresh', 'aria-label': 'Оновити', html: I.ref, onclick: () => load() }),
      h('button', { class: 'ib', 'aria-label': 'Вийти', html: I.out, onclick: () => { if (confirm('Вийти із застосунку?')) logout(); } })),
    coord ? coordBar() : null);
  app.append(top);
  if (S.error) app.append(h('div', { class: 'banner err' }, S.offline ? 'Немає з\'єднання. Показано дані, збережені ' + (S.loadedAt ? new Date(S.loadedAt).toLocaleString('uk-UA') : '') : S.error));
  const main = h('main');
  app.append(main);
  if (!S.data) { main.append(h('div', { class: 'empty' }, h('b', null, 'Завантажую поїздки…'))); return; }
  if (coord) renderCoord(main); else renderDriver(main);
}

function carsLine() {
  const cars = S.data?.cars || [];
  if (!cars.length) return (S.user?.cars || []).join(', ');
  return cars.map(c => c.car || c.code).join(', ');
}

// ====== ВОДІЙ ======
function renderDriver(main) {
  const d = S.data, today = d.today;
  const coords = d.coordinators || [];
  if (coords.length) main.append(h('div', { class: 'calls' }, coords.map(c => h('a', { href: tel(c.phone) }, ico('ph'), h('span', null, 'Координатор: ' + c.name)))));
  const hero = heroTrip(d.trips, today);
  if (hero) main.append(heroCard(hero, today));
  const left = d.trips.filter(t => t.date === today && !['завершено', 'відмінено'].includes(t.status)).sort(byTime);
  const dayRoute = left.length > 1 ? routeHref(left.flatMap(t => [t.from, t.to])) : null;
  main.append(h('div', { class: 'tools' },
    dayRoute ? h('a', { class: 'tool', href: dayRoute, target: '_blank', rel: 'noopener' }, ico('nav'), 'Маршрут на сьогодні (' + left.length + ' поїзд.)') : null,
    h('button', { class: 'tool', onclick: () => { ls.set('maps', mapsApp() === 'google' ? 'apple' : 'google'); render(); } }, 'Навігація: ' + (mapsApp() === 'google' ? 'Google Maps' : 'Apple Maps'))));
  const days = [today, addDays(today, 1)];
  let any = false;
  for (const day of days) {
    const list = d.trips.filter(t => t.date === day).sort(byTime);
    const active = list.filter(t => t.status !== 'відмінено' && t.status !== 'завершено').length;
    main.append(h('div', { class: 'sec' }, h('h3', null, dayTitle(day, today)), h('span', { class: 'c' }, list.length ? (active + ' з ' + list.length + ' активні') : '')));
    if (!list.length) { main.append(h('div', { class: 'card', style: 'color:var(--muted)' }, 'Поїздок немає')); continue; }
    any = true;
    list.forEach(t => main.append(tripCard(t, false)));
  }
  if (!any) main.append(h('div', { class: 'empty' }, h('b', null, 'На сьогодні й завтра поїздок немає'), 'Нові завдання з\'являться тут автоматично.'));
}
// Поточна поїздка (уже в процесі) або найближча наступна.
function heroTrip(trips, today) {
  const mine = trips.filter(t => t.status !== 'відмінено' && t.status !== 'завершено').sort((a, b) => a.date.localeCompare(b.date) || byTime(a, b));
  return mine.find(t => ACTIVE.includes(t.status)) || mine.find(t => t.date === today) || mine[0] || null;
}
function heroCard(t, today) {
  const st = nextStep(t);
  const start = mins(t.tFrom);
  const isToday = t.date === today;
  let timing = '';
  let late = false;
  if (start != null && isToday && !ACTIVE.includes(t.status)) {
    const diff = start - nowMin();
    if (diff > 0) timing = 'Подача через ' + dur(diff);
    else { timing = 'Час подачі минув ' + dur(diff) + ' тому'; late = true; }
  } else if (!isToday) timing = dayTitle(t.date, today) + ', подача о ' + fmtT(t.tFrom);
  const stepsDone = { 'призначено': 0, 'прийнято': 0, 'в дорозі': 1, 'на місці': 2, 'з пасажирами': 3, 'завершено': 4 }[t.status] || 0;
  const stepper = h('div', { class: 'stepper' }, [['Подача', t.from], ['Пасажири', t.people || (t.pax ? t.pax + ' ос.' : '')], ['Призначення', t.to]].filter((x, i) => i < 2 || t.to).map(([lab, val], i) =>
    h('div', { class: 'stp' + (stepsDone > i + 1 ? ' done' : stepsDone === i + 1 ? ' cur' : '') }, h('i'), h('b', null, lab), h('span', null, cleanPt(val) || '—'))));
  const btn = st ? h('button', { class: 'btn hero-btn', onclick: e => doStep(t, st, e.currentTarget) }, st.label) : null;
  const navNow = ACTIVE.includes(t.status) ? navHref(t.status === 'з пасажирами' ? t.to : t.from) : null;
  return h('div', { class: 'hero' + (late ? ' late' : '') },
    h('div', { class: 'hero-top' }, h('span', null, ACTIVE.includes(t.status) ? 'Зараз' : 'Наступна поїздка'), h('span', { class: 'chip st', style: 'background:' + (ST_COL[t.status] || 'var(--st-pr)') }, t.status)),
    h('div', { class: 'hero-tm num' }, fmtT(t.tFrom), t.tTo ? h('small', null, ' → ' + fmtT(t.tTo)) : null),
    timing ? h('div', { class: 'hero-timing' }, timing) : null,
    stepper,
    t.flight ? h('div', { class: 'hero-note' }, 'Рейс: ' + t.flight) : null,
    t.note ? h('div', { class: 'hero-note' }, 'Коментар: ' + t.note) : null,
    btn, st?.hint ? h('div', { class: 'hero-hint' }, st.hint) : null,
    h('div', { class: 'acts' },
      navNow ? h('a', { class: 'act sec2', href: navNow, target: '_blank', rel: 'noopener' }, ico('nav'), 'Навігація') : null,
      t.contact ? h('a', { class: 'act sec2', href: tel(t.contact), }, ico('ph'), 'На місці') : null,
      h('button', { class: 'act sec2', onclick: () => noteSheet(t) }, ico('note'), 'Коментар')));
}
// Крок водія: спершу відкриваємо навігацію (iOS дозволяє лише одразу після натискання), потім пишемо статус.
function doStep(t, st, btn) {
  if (st.nav) { const u = navHref(t[st.nav]); if (u) window.open(u, '_blank'); }
  setStatus(t, st.to, btn);
}
function byTime(a, b) { return (mins(a.tFrom) ?? mins(a.tTo) ?? 9999) - (mins(b.tFrom) ?? mins(b.tTo) ?? 9999) || String(a.car).localeCompare(String(b.car)); }

function tripCard(t, coord, conflict) {
  const badge = badgeOf(t);
  const x = t.status === 'відмінено';
  const car = (S.data.cars || []).find(c => c.code === t.car);
  const card = h('div', { class: 'card' + (badge ? ' new' : '') + (conflict ? ' conf' : '') + (x ? ' x' : ''), onclick: () => { if (badge) { markSeen(t); card.classList.remove('new'); card.querySelector('.badge')?.remove(); } } });
  const sp = span(t);
  card.append(h('div', { class: 'chead' },
    h('div', { class: 'tm num' }, fmtT(t.tFrom), t.tTo && mins(t.tTo) != null ? h('small', null, ' → ' + fmtT(t.tTo)) : (sp && /-|–/.test(t.tFrom) ? h('small', null, ' → ' + hhmm(sp[1])) : null)),
    h('span', { class: 'sp' }),
    badge ? h('span', { class: 'chip badge' }, badge) : null,
    conflict ? h('span', { class: 'chip cf' }, 'КОНФЛІКТ') : null,
    coord && atRisk(t) ? h('span', { class: 'chip cf' }, 'НЕ ВИЇХАВ') : null,
    t.type ? h('span', { class: 'chip' }, t.type) : null,
    h('span', { class: 'chip st', style: 'background:' + (ST_COL[t.status] || 'var(--st-pr)') }, t.status)));
  if (coord) card.append(h('div', { style: 'margin-top:8px;display:flex;gap:6px;flex-wrap:wrap' },

    t.deleg ? h('span', { class: 'chip' }, t.deleg) : null));

  const pts = h('div', { class: 'pts' });
  const row = (cls, label, sub, point) => {
    const href = navHref(point);
    pts.append(h('span', { class: 'dot ' + cls }), h('div', { class: 'pt' }, label || '—', sub ? h('small', null, sub) : null),
      href ? h('a', { class: 'nav', href, target: '_blank', rel: 'noopener', onclick: e => e.stopPropagation() }, ico('nav'), 'Навігація') : h('span'));
  };
  row('', t.from, 'подача' + (t.tFrom ? ' · ' + fmtT(t.tFrom) : ''), t.from);
  if (t.to) row('b', t.to, 'призначення' + (t.tTo ? ' · ' + fmtT(t.tTo) : ''), t.to);

  const meta = h('dl', { class: 'meta' });

  m('Пасажири', [t.pax ? t.pax + ' ос.' : '', t.people].filter(Boolean).join(' — '));
  if (t.flight) { const fh = flightHref(t.flight); m('Рейс', fh ? h('span', null, t.flight + ' · ', h('a', { href: fh, target: '_blank', rel: 'noopener', onclick: e => e.stopPropagation() }, 'статус рейсу')) : t.flight); }
  if (!coord) m('Делегація', t.deleg);
  m('Відповідальний', t.resp);
  const routeTxt = String(t.route || '').replace(URL_RE, '').trim();
  m('Маршрут', routeTxt);
  m('Коментар', t.note);
  if (coord && car?.phone) m('Водій', car.driver + ' · ' + fmtPhone(car.phone));
  if (coord && t.updated) m('Оновлено', t.updated);
  if (meta.childNodes.length) card.append(meta);

  const acts = h('div', { class: 'acts' });
  if (!x) {
    const st = !coord ? nextStep(t) : null;
    if (st) acts.append(h('button', { class: 'act main', onclick: e => { e.stopPropagation(); doStep(t, st, e.currentTarget); } }, st.label));
    if (t.contact) acts.append(h('a', { class: 'act sec2', href: tel(t.contact), onclick: e => e.stopPropagation() }, ico('ph'), 'На місці'));
    if (coord && car?.phone) acts.append(h('a', { class: 'act sec2', href: tel(car.phone), onclick: e => e.stopPropagation() }, ico('ph'), 'Водій'));
    const routeUrl = URL_RE.exec(t.route || '');
    if (routeUrl) acts.append(h('a', { class: 'act sec2', href: routeUrl[0], target: '_blank', rel: 'noopener', onclick: e => e.stopPropagation() }, 'Карта'));
    if (!coord) acts.append(h('button', { class: 'act sec2', 'aria-label': 'Коментар', onclick: e => { e.stopPropagation(); noteSheet(t); } }, ico('note')));
  }
  if (coord) acts.append(h('button', { class: 'act sec2', onclick: e => { e.stopPropagation(); shareSheet([t]); } }, 'Поділитися'));
  if (coord) acts.append(h('button', { class: 'act sec2', onclick: e => { e.stopPropagation(); markSeen(t); editSheet(t); } }, 'Змінити'));
  if (acts.childNodes.length) card.append(acts);
  return card;
}

async function setStatus(t, st, btn) {
  if (btn) { btn.disabled = true; btn.textContent = 'Зберігаю…'; }
  try {
    await api('status', { uid: t.uid, status: st });
    t.status = st; markSeen(t); ls.set('data', S.data); toast('Статус: ' + st); render();
  } catch (e) { toast(e.message); if (btn) { btn.disabled = false; btn.textContent = 'Спробувати ще'; } }
}

function noteSheet(t) {
  const ta = h('textarea', { class: 'inp', placeholder: 'Наприклад: затримка 10 хв, чекаю біля входу B' });
  ta.value = t.note || '';
  const stamp = () => new Date().toLocaleTimeString('uk-UA', { hour: '2-digit', minute: '2-digit' });
  const quick = ['Запізнююсь ~5 хв', 'Запізнююсь ~10 хв', 'Запізнююсь ~15 хв', 'Чекаю на місці', 'Пасажирів ще немає', 'Затор на маршруті'];
  const chips = h('div', { class: 'quick' }, quick.map(q => h('button', { class: 'chipbtn', onclick: () => { ta.value = q + ' (' + stamp() + ')' + (ta.value ? '\n' + ta.value : ''); } }, q)));
  sheet('Коментар до поїздки ' + fmtT(t.tFrom), [chips, ta, h('div', { class: 'hero-hint', style: 'text-align:left' }, 'Коментар одразу бачить координатор.')], [
    h('button', { class: 'btn', onclick: async e => {
      e.currentTarget.disabled = true;
      try { await api('note', { uid: t.uid, note: ta.value.trim() }); t.note = ta.value.trim(); closeSheet(); toast('Збережено'); render(); }
      catch (x) { toast(x.message); e.currentTarget.disabled = false; }

}

// ====== КООРДИНАТОР ======

    h('div', { class: 'dbar' },
      h('button', { class: 'ib', 'aria-label': 'Попередній день', html: I.l, onclick: () => goDay(addDays(day, -1)) }),
      h('label', { class: 'd', style: 'position:relative;cursor:pointer', onclick: () => di.showPicker?.() }, dayTitle(day, d.today), di),
      day !== d.today ? h('button', { class: 'ib', onclick: () => goDay(d.today) }, 'Сьогодні') : null,
      h('button', { class: 'ib', 'aria-label': 'Наступний день', html: I.r, onclick: () => goDay(addDays(day, 1)) })),
    h('div', { class: 'seg' }, [['timeline', 'Шкала'], ['list', 'Список'], ['cars', 'Авто']].map(([k, l]) =>
      h('button', { class: S.view === k ? 'on' : '', onclick: () => { S.view = k; ls.set('view', k); render(); } }, l))));
}
function goDay(day) {
  if (!day) return;
  S.day = day;
  if (day < S.data.from || day > S.data.to) load({ from: addDays(day, -3), to: addDays(day, 14) });
  render();
}

function conflicts(list) {
  const out = new Set();
  const by = {};
  list.filter(t => t.car && t.status !== 'відмінено').forEach(t => (by[t.car] = by[t.car] || []).push(t));
  for (const arr of Object.values(by)) {
    const iv = arr.map(t => [t, span(t)]).filter(x => x[1]).sort((a, b) => a[1][0] - b[1][0]);
    for (let i = 0; i < iv.length; i++) for (let j = i + 1; j < iv.length; j++) {
      if (iv[j][1][0] >= iv[i][1][1]) break;
      if (sameTrip(iv[i][0], iv[j][0])) continue;
      out.add(iv[i][0].uid); out.add(iv[j][0].uid);
    }
  }
  return out;
}
// Однакова точка й час подачі для того самого авто — це той самий рейс (кілька рядків на групу), не конфлікт.
function sameTrip(a, b) { return mins(a.tFrom) === mins(b.tFrom) && String(a.from).trim().toLowerCase() === String(b.from).trim().toLowerCase(); }

function renderCoord(main) {
  const d = S.data, day = S.day || d.today;
  let list = d.trips.filter(t => t.date === day).sort(byTime);
  const cf = conflicts(list);
  const noCar = list.filter(t => !t.car && t.status !== 'відмінено');
  const going = list.filter(t => t.status === 'в дорозі' || t.status === 'на місці').length;
  const done = list.filter(t => t.status === 'завершено').length;
  const fresh = list.filter(t => badgeOf(t)).length;
  const risk = list.filter(atRisk);
  const stat = (n, l, key, warn) => h('button', { class: 'stat' + (warn && n ? ' warn' : '') + (S.filter === key ? ' on' : ''), onclick: () => { S.filter = S.filter === key ? '' : key; render(); } }, h('b', { class: 'num' }, n), l);
  main.append(h('div', { class: 'stats' },
    stat(list.length, 'поїздок', ''), stat(going, 'в дорозі', 'go'), stat(done, 'завершено', 'done'),
    stat(risk.length, 'не виїхали', 'risk', true), stat(cf.size, 'конфлікти', 'cf', true), stat(noCar.length, 'без авто', 'nocar', true), fresh ? stat(fresh, 'нові/змінені', 'new') : null));

  if (S.filter === 'go') list = list.filter(t => t.status === 'в дорозі' || t.status === 'на місці');
  if (S.filter === 'done') list = list.filter(t => t.status === 'завершено');
  if (S.filter === 'cf') list = list.filter(t => cf.has(t.uid));
  if (S.filter === 'nocar') list = noCar;
  if (S.filter === 'new') list = list.filter(t => badgeOf(t));
  if (S.filter === 'risk') list = risk;

  if (S.view === 'timeline') return timeline(main, list, cf, day);
  if (S.view === 'cars') return carsView(main, d.trips.filter(t => t.date === day));

  const q = h('input', { class: 'inp search', type: 'search', placeholder: 'Пошук: прізвище, готель, делегація, авто', value: S.q, oninput: e => { S.q = e.target.value; drawList(); } });
  const box = h('div');
  main.append(q, box);
  function drawList() {
    const needle = S.q.trim().toLowerCase();
    const l = needle ? list.filter(t => [t.from, t.to, t.people, t.deleg, t.car, t.resp, t.flight, t.note, t.route].join(' ').toLowerCase().includes(needle)) : list;
    box.replaceChildren(...(l.length ? l.map(t => tripCard(t, true, cf.has(t.uid))) : [h('div', { class: 'empty' }, h('b', null, 'Нічого не знайдено'))]));
  }
  drawList();
  fab(main, day);
}

function fab(main, day) {
  document.body.append(h('button', { class: 'fab', id: 'fab', onclick: () => editSheet({ date: day, status: 'призначено' }) }, ico('plus'), 'Поїздка'));
}

function timeline(main, list, cf, day) {
  const d = S.data;
  const spans = list.map(span).filter(Boolean);
  let h0 = 6, h1 = 22;
  if (spans.length) { h0 = Math.min(h0, Math.floor(Math.min(...spans.map(s => s[0])) / 60)); h1 = Math.max(h1, Math.ceil(Math.max(...spans.map(s => s[1])) / 60)); }
  h1 = Math.min(h1, 26);
  const PX = innerWidth < 600 ? 1.3 : 1.7, W = (h1 - h0) * 60 * PX;
  const codes = [...(d.cars || []).map(c => c.code)];
  list.forEach(t => { if (t.car && !codes.includes(t.car)) codes.push(t.car); });
  const rows = codes.map(code => [code, list.filter(t => t.car === code)]).filter(([code, l]) => l.length || !S.filter);
  const noCar = list.filter(t => !t.car);
  if (noCar.length) rows.unshift(['', noCar]);

  const grid = h('div', { class: 'tl-grid', style: 'width:' + (96 + W) + 'px' });
  const hours = h('div', { class: 'tl-hours' }, h('div', { style: 'width:96px;border-left:0;position:sticky;left:0;background:var(--card);z-index:3' }));
  for (let x = h0; x < h1; x++) hours.append(h('div', { style: 'width:' + 60 * PX + 'px' }, String(x % 24).padStart(2, '0') + ':00'));
  grid.append(hours);
  for (const [code, l] of rows) {
    const car = (d.cars || []).find(c => c.code === code);
    const lane = h('div', { class: 'tl-lane', style: 'width:' + W + 'px;background-image:repeating-linear-gradient(90deg,var(--line) 0 1px,transparent 1px ' + 60 * PX + 'px)' });
    // розкладка по доріжках, щоб блоки не накладались
    const tracks = [];
    l.slice().sort(byTime).forEach(t => {
      const s = span(t); if (!s) return;
      let k = tracks.findIndex(end => end <= s[0]); if (k < 0) { k = tracks.length; tracks.push(0); }
      tracks[k] = s[1];
      const left = (s[0] - h0 * 60) * PX, width = Math.max((s[1] - s[0]) * PX - 3, 46);
      lane.append(h('button', {
        class: 'tl-blk' + (cf.has(t.uid) ? ' cf' : '') + (t.status === 'відмінено' ? ' x' : ''),
        style: `left:${left}px;width:${width}px;top:${6 + k * 50}px;height:46px;background:${ST_COL[t.status] || 'var(--st-pr)'}`,
        title: `${fmtT(t.tFrom)} ${t.from} → ${t.to}`,
        onclick: () => detailSheet(t, cf.has(t.uid))
      }, h('b', { class: 'num' }, fmtT(t.tFrom) + (badgeOf(t) ? ' •' : '')), shortPt(t.from) + ' → ' + shortPt(t.to)));
    });
    lane.style.minHeight = (12 + Math.max(1, tracks.length) * 50) + 'px';
    grid.append(h('div', { class: 'tl-row' },
      h('div', { class: 'tl-lab' }, code ? [h('b', null, code), h('span', null, car ? shortName(car.driver) : '—')] : h('b', { style: 'color:var(--red)' }, 'Без авто')), lane));
  }
  if (day === d.today) {
    const now = new Date(), nm = now.getHours() * 60 + now.getMinutes();
    if (nm >= h0 * 60 && nm <= h1 * 60) grid.append(h('div', { class: 'tl-now', style: 'left:' + (96 + (nm - h0 * 60) * PX) + 'px' }));
  }
  const sc = h('div', { class: 'tl-scroll' }, grid);
  main.append(h('div', { class: 'tl' }, sc));
  if (!list.length) main.append(h('div', { class: 'empty' }, h('b', null, 'На цей день поїздок немає')));
  requestAnimationFrame(() => {
    const first = spans.length ? Math.min(...spans.map(s => s[0])) : 8 * 60;
    const now = new Date().getHours() * 60 + new Date().getMinutes();
    const upcoming = spans.filter(s => s[1] >= now).map(s => s[0]);
    const target = day === d.today && upcoming.length ? Math.max(Math.min(...upcoming), now - 60) - 30 : first - 30;
    sc.scrollLeft = Math.max(0, (target - h0 * 60) * PX);
  });
  fab(main, day);
}
function shortPt(p) { return String(p || '—').replace(URL_RE, '').split(/[,(]/)[0].trim().slice(0, 28); }
function shortName(n) { const p = String(n || '').split(/\s+/); return p.length > 1 ? p[0] + ' ' + p[1][0] + '.' : n; }

function carsView(main, list) {
  const d = S.data;
  const box = h('div', { class: 'carl' });
  (d.cars || []).forEach(c => {
    const l = list.filter(t => t.car === c.code && t.status !== 'відмінено').sort(byTime);
    const cur = l.find(t => t.status === 'в дорозі' || t.status === 'на місці');
    const next = l.find(t => t.status === 'призначено' || t.status === 'прийнято');
    box.append(h('div', { class: 'card' },
      c.photo && /^https?:/.test(c.photo) ? h('img', { class: 'carimg', src: c.photo, alt: '', loading: 'lazy' }) : null,
      h('div', { class: 'ci' },
        h('b', null, c.code + ' · ' + (c.driver || '—')),
        h('span', null, [c.car, c.color, c.seats ? c.seats + ' місць' : ''].filter(Boolean).join(' · ')),
        h('div', { style: 'margin-top:6px;font-size:14px' },
          cur ? h('span', { class: 'chip st', style: 'background:' + ST_COL[cur.status] }, cur.status + ' · ' + fmtT(cur.tFrom) + ' ' + shortPt(cur.to)) :
            next ? h('span', { class: 'chip' }, 'далі: ' + fmtT(next.tFrom) + ' ' + shortPt(next.from)) : h('span', { class: 'chip' }, 'вільний'),
          ' ', h('span', { class: 'chip' }, l.length + ' поїзд.'))),
      h('div', { style: 'display:flex;flex-direction:column;gap:6px' },
        c.phone ? h('a', { class: 'ib', href: tel(c.phone), 'aria-label': 'Подзвонити', html: I.ph }) : null,
        l.length ? h('button', { class: 'ib', 'aria-label': 'Поділитися планом водія', html: I.share, onclick: () => shareSheet(l, { plan: c }) }) : null)));
  });
  main.append(box);
  fab(main, S.day || d.today);
}

function detailSheet(t, conflict) {
  markSeen(t);
  sheet(fmtT(t.tFrom) + ' · ' + (t.car || 'без авто'), [tripCard(t, true, conflict)], []);
}

function editSheet(t) {
  const d = S.data, isNew = !t.uid;
  const f = {};
  const inp = (k, label, attrs = {}) => { f[k] = h('input', { class: 'inp', value: t[k] || '', ...attrs }); return h('label', { class: 'fld' }, h('span', null, label), f[k]); };
  const sel = (k, label, opts) => {
    f[k] = h('select', { class: 'inp' }, opts.map(([v, l]) => h('option', { value: v }, l)));
    f[k].value = t[k] || opts[0][0];
    return h('label', { class: 'fld' }, h('span', null, label), f[k]);
  };
  const points = [...new Set(d.trips.flatMap(x => [x.from, x.to]).filter(Boolean))].slice(0, 300);
  const dl = h('datalist', { id: 'pts' }, points.map(p => h('option', { value: p })));
  const dlD = h('datalist', { id: 'dels' }, (d.delegations || []).map(p => h('option', { value: p })));
  f.note = h('textarea', { class: 'inp' }); f.note.value = t.note || '';
  f.route = h('textarea', { class: 'inp', style: 'min-height:60px' }); f.route.value = t.route || '';
  f.people = h('textarea', { class: 'inp', style: 'min-height:60px' }); f.people.value = t.people || '';
  const body = [dl, dlD,
    h('div', { class: 'grid2' },
      inp('date', 'Дата', { type: 'date' }),
      sel('type', 'Тип', [['', '—'], ...(d.types || []).map(x => [x, x])])),
    h('div', { class: 'grid2' },
      inp('tFrom', 'Час подачі', { placeholder: '08:30', inputmode: 'numeric' }),
      inp('tTo', 'Час прибуття', { placeholder: '09:15', inputmode: 'numeric' })),
    inp('from', 'Точка подачі', { list: 'pts', placeholder: 'ПУ, готель, аеропорт…' }),
    inp('to', 'Точка призначення', { list: 'pts' }),
    sel('car', 'Авто', [['', '— не призначено —'], ...(d.cars || []).map(c => [c.code, c.code + ' · ' + (c.driver || '') + (c.seats ? ' · ' + c.seats + ' м.' : '')])]),
    h('div', { class: 'grid2' }, inp('pax', 'Осіб', { inputmode: 'numeric' }), inp('flight', 'Рейс', { placeholder: 'LO389, 11:25' })),
    h('label', { class: 'fld' }, h('span', null, 'Склад (прізвища)'), f.people),
    inp('deleg', 'Делегація', { list: 'dels' }),
    h('div', { class: 'grid2' }, inp('resp', 'Відповідальний'), inp('contact', 'Контакт на місці (тел.)', { type: 'tel' })),
    h('label', { class: 'fld' }, h('span', null, 'Коментар по маршруту / посилання на карту'), f.route),
    h('label', { class: 'fld' }, h('span', null, 'Оперативний коментар'), f.note),
    sel('status', 'Статус', (d.statuses || []).map(x => [x, x]))];
  if (t.car && !(d.cars || []).some(c => c.code === t.car)) f.car.append(h('option', { value: t.car }, t.car)), (f.car.value = t.car);
  const collect = () => { const o = { uid: t.uid }; for (const [k, el] of Object.entries(f)) o[k] = el.value.trim(); return o; };
  const save = async (btn, extra) => {
    const o = { ...collect(), ...extra };
    if (!o.date || !(o.from || o.to)) return toast('Вкажіть дату і хоча б одну точку');
    btn.disabled = true;
    try { await api('save', { trip: o }); closeSheet(); toast(isNew ? 'Поїздку додано' : 'Збережено'); S.day = o.date; await load(); }
    catch (x) { toast(x.message); btn.disabled = false; }
  };
  const foot = [h('button', { class: 'btn', onclick: e => save(e.currentTarget) }, isNew ? 'Додати' : 'Зберегти')];
  if (!isNew) {
    foot.unshift(h('button', { class: 'btn ghost', style: 'flex:0 0 auto;width:auto;padding:0 14px', onclick: () => { closeSheet(); editSheet({ ...collect(), uid: '', car: '', status: 'призначено' }); } }, 'Копія'));
    if (t.status !== 'відмінено') foot.unshift(h('button', { class: 'btn danger', style: 'flex:0 0 auto;width:auto;padding:0 14px', onclick: e => { if (confirm('Позначити поїздку як відмінену?')) save(e.currentTarget, { status: 'відмінено' }); } }, 'Відмінити'));
  }
  sheet(isNew ? 'Нова поїздка' : 'Поїздка ' + fmtT(t.tFrom), body, foot);
}

// ====== ПОДІЛИТИСЯ ======
function atRisk(t) {
  if (!S.data || t.date !== S.data.today || !['призначено', 'прийнято'].includes(t.status)) return false;
  const s0 = mins(t.tFrom); if (s0 == null) return false;
  const n = nowMin(); return n >= s0 - 15 && n < s0 + 180;
}
function dayLong(iso) { const d = dObj(iso); return DOW[d.getDay()] + ', ' + d.getDate() + ' ' + MON[d.getMonth()]; }
function carOf(t) { return (S.data.cars || []).find(c => c.code === t.car); }
function transferText(t, o) {
  const car = carOf(t), L = [];
  const s0 = mins(t.tFrom);
  L.push('Трансфер, ' + dayLong(t.date));
  L.push('Подача: ' + (t.tFrom ? fmtT(t.tFrom) + ', ' : '') + cleanPt(t.from));
  if (t.to) L.push('Призначення: ' + cleanPt(t.to) + (t.tTo ? ' (орієнтовно ' + fmtT(t.tTo) + ')' : ''));
  if (t.flight) L.push('Рейс: ' + t.flight);
  if (t.people || t.pax) L.push('Пасажири' + (t.pax ? ' (' + t.pax + ')' : '') + ': ' + (t.people || '—'));
  L.push('');
  if (s0 != null && o.buf > 0) L.push('Водій чекатиме на місці з ' + hhmm(s0 - o.buf) + ' (за ' + o.buf + ' хв до виїзду). Прохання бути готовими до ' + hhmm(s0) + '.');
  else if (s0 != null) L.push('Прохання бути готовими до ' + hhmm(s0) + '.');
  if (car) {
    L.push('');
    L.push('Авто: ' + [car.car, car.color].filter(Boolean).join(', '));
    L.push('Водій: ' + (car.driver || '—') + (o.phone && car.phone ? ', ' + fmtPhone(car.phone) : ''));
    if (o.photo && car.photo) L.push('Фото авто: ' + car.photo);
  }
  if (t.contact) L.push('Контакт на місці: ' + t.contact);
  if (o.map) { const u = placeHref(t.from); if (u) L.push('Місце подачі на карті: ' + u); }
  return L.join('\n');
}
function planText(list, car, o) {
  const L = ['План водія: ' + dayLong(list[0].date), (car.driver || car.code) + ' · ' + [car.car, car.color].filter(Boolean).join(', ') + (o.phone && car.phone ? ' · ' + fmtPhone(car.phone) : ''), ''];
  list.slice().sort(byTime).forEach(t => {
    L.push(fmtT(t.tFrom) + '  ' + cleanPt(t.from) + (t.to ? ' → ' + cleanPt(t.to) : '') + (t.tTo ? ' (до ' + fmtT(t.tTo) + ')' : ''));
    const extra = [t.people, t.flight ? 'рейс ' + t.flight : '', t.contact ? 'контакт ' + t.contact : ''].filter(Boolean).join(' · ');
    if (extra) L.push('    ' + extra);
  });
  if (o.map) { const r = routeHref(list.slice().sort(byTime).flatMap(t => [t.from, t.to])); if (r) L.push('', 'Маршрут на карті: ' + r); }
  if (o.photo && car.photo) L.push('Фото авто: ' + car.photo);
  return L.join('\n');
}
function shareSheet(list, opt = {}) {
  const o = ls.get('shareOpts', { buf: 10, phone: true, map: true, photo: true });
  const ta = h('textarea', { class: 'inp', style: 'min-height:260px;font-size:15px' });
  const build = () => { ta.value = opt.plan ? planText(list, opt.plan, o) : transferText(list[0], o); };
  const tog = (k, label) => h('label', { class: 'chk' }, h('input', { type: 'checkbox', checked: o[k] ? true : null, onchange: e => { o[k] = e.target.checked; ls.set('shareOpts', o); build(); } }), label);
  const bufSel = h('div', { class: 'seg', style: 'margin:0 0 10px' }, [0, 10, 15].map(b => h('button', { class: o.buf === b ? 'on' : '', onclick: e => { o.buf = b; ls.set('shareOpts', o); [...e.currentTarget.parentNode.children].forEach(x => x.classList.toggle('on', x === e.currentTarget)); build(); } }, b ? 'Водій за ' + b + ' хв' : 'Без запасу')));
  build();
  const copy = async () => { try { await navigator.clipboard.writeText(ta.value); toast('Скопійовано'); } catch { ta.select(); document.execCommand('copy'); toast('Скопійовано'); } };
  const body = [!opt.plan ? bufSel : null, h('div', { class: 'quick' }, tog('phone', 'Телефон водія'), tog('map', opt.plan ? 'Маршрут на карті' : 'Точка на карті'), tog('photo', 'Фото авто')), ta,
    h('div', { class: 'hero-hint', style: 'text-align:left' }, 'Текст можна підправити перед відправкою.')];
  const foot = [h('button', { class: 'btn ghost', style: 'flex:0 0 auto;width:auto;padding:0 18px', onclick: copy }, 'Копіювати')];
  if (navigator.share) foot.push(h('button', { class: 'btn', onclick: async () => { try { await navigator.share({ text: ta.value }); } catch (e) { if (e.name !== 'AbortError') copy(); } } }, 'Поділитися…'));
  sheet(opt.plan ? 'План водія' : 'Поділитися поїздкою', body, foot);
}

// ====== bottom sheet ======
function sheet(title, body, foot) {
  closeSheet();
  const ov = h('div', { class: 'ov', id: 'ov', onclick: e => { if (e.target === ov) closeSheet(); } },
    h('div', { class: 'sheet', role: 'dialog', 'aria-modal': 'true' },
      h('div', { class: 'sh-h' }, h('h3', null, title), h('button', { class: 'ib', 'aria-label': 'Закрити', html: I.x, onclick: closeSheet })),
      h('div', { class: 'sh-b' }, body),
      foot && foot.length ? h('div', { class: 'sh-f' }, foot) : null));
  document.body.append(ov);
  document.body.style.overflow = 'hidden';
}
function closeSheet() { $('#ov')?.remove(); document.body.style.overflow = ''; }

// ====== старт ======
const _render = render;
render = function () { $('#fab')?.remove(); return _render(); };
if (S.token) { render(); load(); } else renderLogin();
setInterval(() => { if (S.token && document.visibilityState === 'visible' && !$('#ov')) load(); }, POLL_MS);
document.addEventListener('visibilitychange', () => { if (S.token && document.visibilityState === 'visible' && Date.now() - (S.loadedAt || 0) > 20000) load(); });
addEventListener('online', () => S.token && load());
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});

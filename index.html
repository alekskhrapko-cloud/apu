// ====== API ======
async function api(action, payload = {}) {
  const res = await fetch(API, { method: 'POST', body: JSON.stringify({ action, token: S.token, ...payload }) });
  if (!res.ok) throw new Error('Сервер недоступний (' + res.status + ')');
  const j = await res.json();
  if (!j.ok && j.error === 'auth') { logout(j.message); throw new Error(j.message); }
  if (!j.ok) throw new Error(j.error || 'Помилка');
  return j;
}

  loading: false, error: '', offline: false,

function logout(msg) {
  if (geoOn() && S.token) { try { geoStop(true); } catch {} ls.set('geo', false); }
  ['token', 'user', 'data', 'loadedAt', 'seen'].forEach(ls.del);
  Object.assign(S, { token: null, user: null, data: null, seen: null });
  renderLogin(msg || '');
}

async function load(range) {
  if (S.loading) return;
  S.loading = true; paintBusy();
  try {
    const d = await api('data', range || (S.user?.admin && S.data ? { from: S.data.from, to: S.data.to } : {}));
    if (!range) notifyNew(S.data, d);
    S.data = d; S.user = d.user; S.loadedAt = Date.now(); S.error = ''; S.offline = false;
    if (!S.day || (S.day < d.from || S.day > d.to)) S.day = d.today;
    if (!S.seen) { S.seen = {}; d.trips.forEach(t => S.seen[t.uid] = tripHash(t)); ls.set('seen', S.seen); }
    ls.set('data', d); ls.set('user', d.user); ls.set('loadedAt', S.loadedAt);
  } catch (e) {
    S.error = e.message; S.offline = !navigator.onLine || /fetch|network|Load failed/i.test(e.message);
  } finally {
    S.loading = false;
    if (S.token) render();
  }
}

function notifyNew(before, after) {
  if (!before) return;

  const fresh = after.trips.filter(t => t.status !== 'завершено' && (!old.has(t.uid) || old.get(t.uid) !== tripHash(t)));

// ====== ВХІД ======

  const err = h('div', { class: 'err' }, msg || '');

    onsubmit: async e => {
      e.preventDefault(); err.textContent = ''; btn.disabled = true; btn.textContent = 'Перевіряю…';
      try {
        const j = await api('login', { login: login.value.trim(), pin: pin.value.trim() });

    }

    h('label', { class: 'fld' }, h('span', null, 'Логін'), login),
    h('label', { class: 'fld' }, h('span', null, 'PIN-код'), pin),

    h('div', { class: 'plate', 'aria-hidden': 'true' }, h('i', null, 'D'), h('b', null, '0-ПУ')),
    h('h2', null, 'Авто ПУ'),
    h('p', null, 'Поїздки водіїв Посольства на час візитів. Увійдіть логіном і PIN-кодом із вашої картки.'),

  if (!S.token) return renderLogin();
  const coord = !!S.user?.admin;
  document.body.classList.toggle('wide', coord);
  const app = $('#app'); app.replaceChildren();
  const updated = S.loadedAt ? 'оновлено о ' + new Date(S.loadedAt).toLocaleTimeString('uk-UA', { hour: '2-digit', minute: '2-digit' }) : 'завантаження…';
  const top = h('header', { class: 'top' },
    h('div', { class: 'top-row' },
      h('div', { style: 'flex:1;min-width:0' },
        h('h1', null, coord ? 'Координація авто' : (S.user?.name || 'Мої поїздки')),
        h('div', { class: 'sub' }, h('span', null, coord ? S.user?.name : carsLine()), h('span', null, updated))),
      h('button', { class: 'ib' + (S.loading ? ' spin' : ''), id: 'refresh', 'aria-label': 'Оновити', html: I.ref, onclick: () => load() }),
      h('button', { class: 'ib', 'aria-label': 'Вийти', html: I.out, onclick: () => { if (confirm('Вийти із застосунку?')) logout(); } })),
    coord ? coordBar() : null);
  app.append(top);
  if (S.error) app.append(h('div', { class: 'banner err' }, S.offline ? 'Немає з\'єднання. Показано дані, збережені ' + (S.loadedAt ? new Date(S.loadedAt).toLocaleString('uk-UA') : '') : S.error));
  const main = h('main');
  app.append(main);
  if (!S.data) { main.append(h('div', { class: 'empty' }, h('b', null, 'Завантажую поїздки…'))); return; }
  if (coord) renderCoord(main); else renderDriver(main);

function carsLine() {
  const cars = S.data?.cars || [];
  if (!cars.length) return (S.user?.cars || []).join(', ');
  return cars.map(c => c.car || c.code).join(', ');
}

function conflicts(list) {
  const out = new Set();
  const by = {};
  list.filter(t => t.car && t.status !== 'відмінено').forEach(t => (by[t.car] = by[t.car] || []).push(t));
  for (const arr of Object.values(by)) {
    const iv = arr.map(t => [t, span(t)]).filter(x => x[1]).sort((a, b) => a[1][0] - b[1][0]);
    for (let i = 0; i < iv.length; i++) for (let j = i + 1; j < iv.length; j++) {
      if (iv[j][1][0] >= iv[i][1][1]) break;
      if (sameTrip(iv[i][0], iv[j][0])) continue;
      out.add(iv[i][0].uid); out.add(iv[j][0].uid);
    }
  }
  return out;
}

function timeline(main, list, cf, day) {
  const d = S.data;
  const spans = list.map(span).filter(Boolean);
  let h0 = 6, h1 = 22;
  if (spans.length) { h0 = Math.min(h0, Math.floor(Math.min(...spans.map(s => s[0])) / 60)); h1 = Math.max(h1, Math.ceil(Math.max(...spans.map(s => s[1])) / 60)); }

  const PX = innerWidth < 600 ? 1.3 : 1.7, W = (h1 - h0) * 60 * PX;
  const codes = [...(d.cars || []).map(c => c.code)];
  list.forEach(t => { if (t.car && !codes.includes(t.car)) codes.push(t.car); });

async function api(action, payload = {}) {

function conflicts(list) {
  const out = new Set();
  const by = {};
  list.filter(t => t.car && t.status !== 'відмінено').forEach(t => (by[t.car] = by[t.car] || []).push(t));
  for (const arr of Object.values(by)) {
    const iv = arr.map(t => [t, span(t)]).filter(x => x[1]).sort((a, b) => a[1][0] - b[1][0]);
    for (let i = 0; i < iv.length; i++) for (let j = i + 1; j < iv.length; j++) {
      if (iv[j][1][0] >= iv[i][1][1]) break;
      if (sameTrip(iv[i][0], iv[j][0])) continue;
      out.add(iv[i][0].uid); out.add(iv[j][0].uid);
    }
  }
  return out;
}

    const next = l.filter(p => p.from && p.from.slice(0, 10) > day).sort((a, b) => a.from.localeCompare(b.from))[0];
    const prev = l.filter(p => p.to && p.to.slice(0, 10) < day).sort((a, b) => b.to.localeCompare(a.to))[0];
    note = next && (!prev || next.from.slice(0, 10) <= addDays(day, 3)) ? 'ще не в Берліні · прибуде ' + presDT(next.from) : prev ? 'поїхав додому відпочивати :)' : 'не в Берліні';

// Підбір авто на час поїздки o. Вільне — без перетину (±15 хв на під'їзд); «об'єднати» — та сама подача
// або те саме призначення з різницею до 20 хв і вистачає місць; рекомендація — вільне з найменшим запасом місць і навантаженням.
// ===== Склад пасажирів: прізвища з попередніх поїздок + нові =====
function splitPeople(str) {
  return String(str || '').split(/\n|;|,/).map(x => x.replace(/^[^:]{0,60}:\s*/, '').replace(/\s+/g, ' ').trim()).filter(x => x.length > 1 && x.length < 60 && !/^\d+$/.test(x));
}
// Схоже на прізвище/ім'я людини (а не на опис на кшталт «формування кортежу»).

  const cnt = new Map(), byDel = new Set();
  trips.forEach(t => splitPeople(t.people).filter(looksLikeName).forEach(n => { cnt.set(n, (cnt.get(n) || 0) + 1); if (deleg && t.deleg === deleg) byDel.add(n); }));
  return { all: [...cnt.keys()].sort((a, b) => cnt.get(b) - cnt.get(a) || a.localeCompare(b, 'uk')), deleg: [...byDel] };
}
// Контакти з попередніх поїздок («Відповідальний», «Контакт на місці»): ім'я + телефон.
function knownContacts(trips) {
  const m = new Map();
  trips.forEach(t => [t.resp, t.contact].forEach(v => { v = String(v || '').trim(); if (v && v.length < 80) m.set(v, (m.get(v) || 0) + 1); }));
  return [...m.keys()].sort((a, b) => m.get(b) - m.get(a));
}
// Вибір з контактів телефона (Android Chrome; на iPhone Safari цієї функції поки немає).

  if (!('contacts' in navigator && 'select' in navigator.contacts)) return null;

    h('input', { type: 'range', min: '0', max: '1', step: '0.05', value: String(RADIO.audio?.volume ?? ls.get('radioVol', .8)), 'aria-label': 'Гучність', oninput: e => { if (RADIO.audio) RADIO.audio.volume = +e.target.value; ls.set('radioVol', +e.target.value); } }),

function radioView(main) {

  const tabs = h('div', { class: 'rtabs' }, ...[['fav', 'Добірка'], ['techno', 'Техно'], ['UA', 'Популярні в Україні'], ['DE', 'Популярні в Німеччині']].map(([k, l]) => h('button', { class: RADIO.tab === k ? 'on' : '', onclick: () => { RADIO.tab = k; ls.set('radioTab', k); RADIO.q = ''; search.value = ''; draw(); tabs.querySelectorAll('button').forEach(b => b.classList.toggle('on', b.textContent === l)); } }, l)));
  main.append(h('p', { class: 'lead-n' }, 'Для настрою в офісі чи в дорозі. Радіо грає далі, поки ви працюєте в інших розділах.'), tabs, search, grid);
  const card = (st, i) => h('button', { class: 'rcard' + (RADIO.cur?.url === st.url_resolved ? ' cur' : ''), style: '--i:' + i, onclick: e => { radioPlay(st); grid.querySelectorAll('.rcard').forEach(c => c.classList.remove('cur')); e.currentTarget.classList.add('cur'); } },
    h('span', { class: 'rc-logo' }, st.favicon ? h('img', { src: st.favicon, alt: '', loading: 'lazy', referrerpolicy: 'no-referrer', onerror: e => e.target.replaceWith(h('b', null, (st.label || st.name || '?').trim()[0])) }) : h('b', null, (st.label || st.name || '?').trim()[0])),
    h('span', { class: 'rc-t' }, h('b', null, st.label || st.name), h('small', null, [st.countrycode, (st.tags || '').split(',').slice(0, 2).join(', ')].filter(Boolean).join(' · '))));

      else if (RADIO.tab === 'fav') list = (await Promise.all(RADIO_FAV.map(([label, q, cc]) => radioFind(q, cc).then(r => r[0] && { ...r[0], label }).catch(() => null)))).filter(Boolean);
      else if (RADIO.tab === 'techno') list = (await fetch(RADIO_API + '/stations/search?' + new URLSearchParams({ tag: 'techno', hidebroken: 'true', order: 'votes', reverse: 'true', limit: '40' })).then(r => r.json())).filter(radioOk);
      else list = (await fetch(RADIO_API + '/stations/search?' + new URLSearchParams({ countrycode: RADIO.tab, hidebroken: 'true', order: 'votes', reverse: 'true', limit: '40' })).then(r => r.json())).filter(radioOk);

}

// ====== Швидкий пошук (⌘K / Ctrl K) ======
const IS_MAC = /Mac|iPhone|iPad/.test(navigator.platform || navigator.userAgent);
function palette() {
  if (!S.data || !S.user?.admin || S.ro || $('.pal-ov')) return;
  const d = S.data;
  const inp = h('input', { class: 'pal-in', placeholder: 'Прізвище, готель, авто, час 16:30…', autocomplete: 'off', spellcheck: 'false' });
  const res = h('div', { class: 'pal-r', role: 'listbox' });
  let items = [], sel = 0;
  const close = () => { ov.classList.add('out'); setTimeout(() => ov.remove(), 200); };
  const go = it => { close(); setTimeout(it.run, 10); };
  const cmds = [
    { k: 'cmd', t: 'Нова поїздка', s: 'Додати на ' + dayTitle(S.day || d.today, d.today).toLowerCase(), run: () => editSheet({ date: S.day || d.today, status: 'призначено' }) },
    ...VIEWS.map(([k, l]) => ({ k: 'cmd', t: 'Перейти: ' + (VIEW_TITLE[k] || l), s: '', run: () => setView(k) })),
    { k: 'cmd', t: 'Поїздка з повідомлення', s: 'вставити текст із WhatsApp', run: () => pasteSheet() },
    { k: 'cmd', t: 'Копіювати день', s: dayTitle(S.day || d.today, d.today), run: () => copyDaySheet(S.day || d.today) }
  ];
  const draw = () => {
    const q = inp.value.trim().toLowerCase(), words = q.split(/\s+/).filter(Boolean);
    const hit = str => words.every(w => str.toLowerCase().includes(w));
    if (!q) items = cmds.slice(0, 4).concat(d.trips.filter(t => t.date === d.today && t.status !== 'відмінено' && t.status !== 'завершено').sort(byTime).slice(0, 5).map(tripItem));
    else items = [
      ...d.trips.filter(t => hit([fmtT(t.tFrom), t.from, t.to, t.people, t.deleg, t.car, tripDriver(t), t.flight, t.resp, dayTitle(t.date, d.today)].join(' '))).sort((a, b) => (a.date === d.today ? -1 : 0) - (b.date === d.today ? -1 : 0) || a.date.localeCompare(b.date) || byTime(a, b)).slice(0, 8).map(tripItem),
      ...(d.cars || []).filter(c => hit([c.code, c.car, (c.drivers || [c.driver]).join(' ')].join(' '))).slice(0, 4).map(c => ({ k: 'car', t: c.code + ' · ' + (c.car || ''), s: (c.drivers || [c.driver]).filter(Boolean).map(shortName).join(', '), run: () => { S.filter = ''; S.q = c.code; setView('list'); render(); } })),
      ...(d.drivers || []).filter(x => hit(x.name)).slice(0, 4).map(x => ({ k: 'drv', t: x.name, s: 'Відкрити кабінет водія', run: async () => { const r = PEEK.list || (PEEK.list = (await api('driverList')).list); const u = r.find(y => sameName(y.name, x.name)); u ? peekTab(u) : toast('У водія немає облікового запису'); } })),
      ...cmds.filter(c => hit(c.t))];
    sel = Math.min(sel, Math.max(0, items.length - 1));
    res.replaceChildren(...(items.length ? items.map((it, i) => h('button', { class: 'pal-i' + (i === sel ? ' on' : ''), role: 'option', onmouseenter: () => { sel = i; paintSel(); }, onclick: () => go(it) },
      h('span', { class: 'pal-k ' + it.k }, { trip: 'Поїздка', car: 'Авто', drv: 'Водій', cmd: 'Дія' }[it.k]), h('span', { class: 'pal-t' }, h('b', null, it.t), it.s ? h('small', null, it.s) : null))) : [h('div', { class: 'pal-e' }, 'Нічого не знайдено')]));
  };
  const tripItem = t => ({ k: 'trip', t: fmtT(t.tFrom) + '  ' + shortPt(t.from) + ' → ' + shortPt(t.to), s: [dayTitle(t.date, d.today), t.car, shortName(tripDriver(t)), t.people && splitPeople(t.people).slice(0, 2).join(', ')].filter(Boolean).join(' · '), run: () => { if (S.day !== t.date) { S.day = t.date; render(); } detailSheet(t, false); } });
  const paintSel = () => [...res.children].forEach((el, i) => { el.classList.toggle('on', i === sel); if (i === sel) el.scrollIntoView({ block: 'nearest' }); });
  inp.addEventListener('input', () => { sel = 0; draw(); });
  inp.addEventListener('keydown', e => {
    if (e.key === 'ArrowDown') { e.preventDefault(); sel = Math.min(items.length - 1, sel + 1); paintSel(); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); sel = Math.max(0, sel - 1); paintSel(); }
    else if (e.key === 'Enter' && items[sel]) go(items[sel]);
    else if (e.key === 'Escape') close();
  });
  const ov = h('div', { class: 'pal-ov', onclick: e => { if (e.target === ov) close(); } },
    h('div', { class: 'pal', role: 'dialog', 'aria-label': 'Швидкий пошук' }, h('div', { class: 'pal-h' }, h('span', { html: I.search, style: 'display:flex' }), inp, h('kbd', null, 'esc')), res,
      h('div', { class: 'pal-f' }, h('span', null, '↑↓ вибір'), h('span', null, '↵ відкрити'))));
  document.body.append(ov); draw(); setTimeout(() => inp.focus(), 20);
}
addEventListener('keydown', e => {
  // Esc закриває відкрите вікно (якщо не відкритий барабан часу чи пошук — вони закриваються першими).
  if (e.key === 'Escape' && $('#ov') && !$('.tw:not(.out)') && !$('.pal-ov')) { e.preventDefault(); closeSheet(); return; }
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); $('.pal-ov') ? null : palette(); }
  else if (e.key === '/' && !/INPUT|TEXTAREA|SELECT/.test(document.activeElement?.tagName) && !$('#ov')) { e.preventDefault(); palette(); }
});

// ====== Потягнути вниз — оновити (телефон) ======
(() => {
  let y0 = null, dy = 0; const ind = h('div', { class: 'ptr', 'aria-hidden': 'true' }, h('span', { html: I.ref }));
  document.body.append(ind);
  addEventListener('touchstart', e => { y0 = scrollY <= 0 && !$('#ov') && !$('.pal-ov') && S.token && !e.target.closest('.tl-scroll,.tw,#mapbox,.gmap,.sw') ? e.touches[0].clientY : null; dy = 0; }, { passive: true });
  addEventListener('touchmove', e => {

    const r = Math.min(90, dy * .5); ind.style.transform = 'translate(-50%,' + r + 'px) rotate(' + dy * 2 + 'deg)'; ind.style.opacity = Math.min(1, r / 60); ind.classList.toggle('arm', r >= 60);
  }, { passive: true });

    else { ind.classList.remove('arm'); ind.style.cssText = ''; }

// ====== імпорт медіа з приватного репозиторію GitHub ======
// Вкладка з файлом (raw.githubusercontent.com/alekskhrapko-cloud/apu-media/…/DUSS.gif) відкриває застосунок з #media=<адреса файлу>.
// Застосунок у сесії координатора забирає файл і кладе в аркуш «Медіа». Інші адреси ігноруються.
(function mediaImport() {
  const m = /^#media=(.+)$/.exec(location.hash); if (!m) return;
  history.replaceState(null, '', location.pathname + location.search);
  let url; try { url = new URL(decodeURIComponent(m[1])); } catch { return; }
  if (url.origin !== 'https://raw.githubusercontent.com' || !url.pathname.startsWith('/alekskhrapko-cloud/apu-media/')) return;
  const f = url.pathname.split('/').pop(), mm = /^([\w \-]{1,20})\.(gif|mp4|jpg|png)(\.b64)?(?:\.txt)?$/i.exec(decodeURIComponent(f)); if (!mm) return;
  const code = mm[1], kind = mm[2].toLowerCase(), mime = { gif: 'image/gif', mp4: 'video/mp4', jpg: 'image/jpeg', png: 'image/png' }[kind];
  const go = () => {
    if (!S.user?.admin || !S.data) return setTimeout(go, 500);
    const car = (S.data.cars || []).find(c => c.code === code);
    const st = h('div', { class: 'hero-hint', style: 'text-align:left' }, 'Готово до завантаження.');
    const btn = h('button', { class: 'btn', onclick: async () => {
      btn.disabled = true;
      try {
        st.textContent = 'Отримую файл…';
        let b64, size;
        if (mm[3]) { b64 = (await (await fetch(url.href)).text()).replace(/\s+/g, ''); size = Math.round(b64.length * 3 / 4); }
        else { const buf = new Uint8Array(await (await fetch(url.href)).arrayBuffer()); let bin = ''; for (let i = 0; i < buf.length; i += 0x8000) bin += String.fromCharCode.apply(null, buf.subarray(i, i + 0x8000)); b64 = btoa(bin); size = buf.length; }
        const buf = { length: size };
        const PER = 8 * 45000, session = Math.random().toString(36).slice(2, 12); let start = 0;
        for (let off = 0; off < b64.length; off += PER) { st.textContent = 'Завантажую ' + Math.round(off / b64.length * 100) + '%…'; const r = await api('mediaPut', { session, code, kind, mime, start, data: b64.slice(off, off + PER), last: off + PER >= b64.length, size: buf.length }); start = r.next; }
        delete _media[code + '.' + kind]; S.data.media = S.data.media || {}; S.data.media[code] = [...new Set([...(S.data.media[code] || []), kind])];
        st.textContent = 'Готово: ' + code + '.' + kind + ' (' + Math.round(buf.length / 1024) + ' КБ).'; st.id = 'import-done';
        render();
      } catch (e) { st.textContent = 'Помилка: ' + e.message; btn.disabled = false; }
    } }, 'Завантажити в застосунок');
    sheet('Імпорт медіа', [h('div', { style: 'font-weight:700;margin-bottom:4px' }, code + '.' + kind), h('div', { class: 'muted', style: 'margin-bottom:10px' }, car ? [modelOf(car) || car.code, plateOf(car), car.driver].filter(Boolean).join(', ') : 'Увага: авто з кодом ' + code + ' немає в довіднику'), st], [btn]);
  };
  go();
})();
